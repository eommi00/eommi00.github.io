<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark"><title>사업 프로젝트 허브</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='3' width='20' height='26' rx='3' fill='%2316201C'/%3E%3Crect x='24' y='6' width='4' height='6' rx='1.5' fill='%232F6B4F'/%3E%3Crect x='24' y='13' width='4' height='6' rx='1.5' fill='%239A6A21'/%3E%3Crect x='24' y='20' width='4' height='6' rx='1.5' fill='%232B3F66'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}/* Layout: 바인더 인덱스 — 왼쪽엔 프로젝트 색 탭 목록(고정), 오른쪽엔 프로젝트 구획과 결과물 줄. 좁은 화면에선 탭 목록이 위쪽 가로 띠가 됨 */
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --panel-2:#F6F8F5; --ink:#16201C; --ink-2:#3B4842; --muted:#64716A;
  --line:#DCE2DC; --line-2:#C5CEC7; --accent:#22486E; --on-accent:#FFFFFF; --focus:#2F6FD0;
  --danger:#A3332B; --danger-bg:#FBE6E3; --note-bg:#EAF0F7;
  --p-pine:#2F6B4F; --p-ochre:#9A6A21; --p-navy:#2B3F66; --p-teal:#1F6E68; --p-brass:#7F6418; --p-slate:#59626E; --p-plum:#764A6A;
  --s-doing:#2457A6; --s-doing-bg:#E4ECF8; --s-review:#875408; --s-review-bg:#FAEED7; --s-wait:#5A4A9C; --s-wait-bg:#ECE8F8;
  --s-done:#1E7346; --s-done-bg:#E1F2E8; --s-hold:#59626E; --s-hold-bg:#ECEEEF; --s-ref:#2A6670; --s-ref-bg:#E0EFF0;
  --shadow:0 1px 2px rgba(22,32,28,.06),0 6px 20px -12px rgba(22,32,28,.18);
  --f-display:"Hahmlet","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --panel:#161D1A; --panel-2:#131916; --ink:#E4EBE7; --ink-2:#B9C5BF; --muted:#8D9993;
  --line:#26302B; --line-2:#36413B; --accent:#9DB8E0; --on-accent:#0D1420; --focus:#8EB0FF;
  --danger:#F08A80; --danger-bg:#3A1C19; --note-bg:#17212E;
  --p-pine:#6DB893; --p-ochre:#D6A55B; --p-navy:#93AADB; --p-teal:#62BDB4; --p-brass:#CDAE5C; --p-slate:#A2ABB7; --p-plum:#C996BB;
  --s-doing:#8DB2F2; --s-doing-bg:#18243A; --s-review:#E7B15C; --s-review-bg:#33260F; --s-wait:#B4A6EE; --s-wait-bg:#241F3A;
  --s-done:#66C892; --s-done-bg:#13301F; --s-hold:#A7B0BC; --s-hold-bg:#22272E; --s-ref:#7CC3CB; --s-ref-bg:#132C30;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --panel:#161D1A; --panel-2:#131916; --ink:#E4EBE7; --ink-2:#B9C5BF; --muted:#8D9993;
  --line:#26302B; --line-2:#36413B; --accent:#9DB8E0; --on-accent:#0D1420; --focus:#8EB0FF;
  --danger:#F08A80; --danger-bg:#3A1C19; --note-bg:#17212E;
  --p-pine:#6DB893; --p-ochre:#D6A55B; --p-navy:#93AADB; --p-teal:#62BDB4; --p-brass:#CDAE5C; --p-slate:#A2ABB7; --p-plum:#C996BB;
  --s-doing:#8DB2F2; --s-doing-bg:#18243A; --s-review:#E7B15C; --s-review-bg:#33260F; --s-wait:#B4A6EE; --s-wait-bg:#241F3A;
  --s-done:#66C892; --s-done-bg:#13301F; --s-hold:#A7B0BC; --s-hold-bg:#22272E; --s-ref:#7CC3CB; --s-ref-bg:#132C30;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{min-height:100%}
.shell{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
.sp{flex:1}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--line-2);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:var(--panel)}
.btn.wide{width:100%;min-height:44px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px;align-self:flex-start}
.linkbtn:hover{color:var(--ink)}
.fld{display:block;font-size:13px;color:var(--ink-2);font-weight:500;min-width:0}
.fld small{font-weight:400;color:var(--muted);margin-left:4px}
.fld > .ctl,.fld > .pwrow{display:flex;margin-top:6px}
.fld > .ctl{display:block}
.ctl{width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;font-size:15px;font-weight:400;color:var(--ink)}
.ctl:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.ctl{resize:vertical;line-height:1.55}
select.ctl{padding-block:8px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer;font-weight:400}
.check input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto}
.err{min-height:1.4em;font-size:13.5px;color:var(--danger)}
.err:empty{min-height:0}
.form-col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pwrow{display:flex;gap:8px}
.pwrow .ctl{flex:1}

/* gate (login, setup, recovery) */
.gate{max-width:1000px;margin:0 auto;padding-block:clamp(28px,9vh,96px) 48px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,400px);gap:44px;align-items:center}
@media (max-width:840px){.gate{grid-template-columns:minmax(0,1fr);gap:26px;padding-block:28px 40px}}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.gate-copy{display:flex;flex-direction:column;gap:12px;min-width:0}
.gate-copy h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,5.2vw,50px);line-height:1.14;letter-spacing:-.02em}
.gate-copy .lede{font-size:16px;color:var(--ink-2);max-width:34em;text-wrap:pretty}
.gate-copy ul{margin:4px 0 0;padding-left:18px;color:var(--ink-2);font-size:14.5px;display:grid;gap:4px;max-width:36em}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px 24px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:18px;font-weight:600}
.card .note{font-size:13px;color:var(--muted)}
.binder{position:absolute;right:-8px;top:26px;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.binder i{display:block;width:8px;height:30px;border-radius:0 5px 5px 0;background:var(--c)}
.gate-foot{grid-column:1/-1;font-size:13px;color:var(--muted);max-width:60em}
.codebox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--panel-2);border:1px dashed var(--line-2);border-radius:10px;padding:14px 16px}
.codebox code{font-family:var(--f-mono);font-size:clamp(16px,4.2vw,20px);letter-spacing:.06em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.loading{padding-block:30vh;text-align:center;color:var(--muted)}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding-block:26px 18px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(25px,3.6vw,34px);line-height:1.2;letter-spacing:-.015em;margin-top:4px}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.role{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--note-bg);color:var(--accent)}
.role.guest{background:var(--s-hold-bg);color:var(--s-hold)}
.who-id{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 9px;font-size:14.5px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-left:5px;color:var(--muted)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,224px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr);gap:16px}}
.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;gap:4px}
.index .lab{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin:2px 0 6px}
.ix{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px 8px 0;border:0;background:none;text-align:left;cursor:pointer;border-radius:0 8px 8px 0;color:var(--ink-2);font-size:14px}
.ix:hover{background:var(--panel);color:var(--ink)}
.ix i{width:10px;height:26px;border-radius:0 4px 4px 0;background:var(--c)}
.ix span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ix b{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted)}
.index .add{margin-top:8px;align-self:flex-start}
@media (max-width:900px){
  .index{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
  .index .lab{display:none}
  .ix{grid-template-columns:8px auto auto;padding:6px 12px 6px 0;border:1px solid var(--line);background:var(--panel);border-radius:0 999px 999px 0;flex:0 0 auto}
  .ix i{width:8px;height:22px}
  .index .add{margin-top:0;flex:0 0 auto}
}
.main{display:flex;flex-direction:column;gap:22px;min-width:0}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-family:var(--f-mono);font-size:11px;opacity:.75}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.search{flex:0 1 260px;min-width:0}
.search .ctl{padding-block:7px;font-size:14px}

/* notices */
.notice{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--note-bg);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink)}
.notice b{font-weight:600}

/* groups */
.group{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0;position:relative}
.g-head{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:16px 18px 12px 20px;border-bottom:1px solid var(--line)}
.g-head::before,.g-form::before{content:"";position:absolute;left:-9px;top:15px;width:8px;height:28px;border-radius:5px 0 0 5px;background:var(--c)}
.g-head h2{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.01em;line-height:1.3}
.g-count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.g-share{font-size:12.5px;color:var(--ink-2);display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.g-share .who-chip{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-2)}
.g-share.none{color:var(--muted)}
.g-tools{display:flex;gap:6px;flex-wrap:wrap}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:6px 16px;padding:14px 18px 14px 20px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.items > li:last-child{border-radius:0 0 11px 11px}
.kind{font-size:12px;font-weight:600;color:var(--c);padding-top:3px;letter-spacing:.01em}
.it-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.it-title{font-size:16px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.it-title a{text-decoration:none}
.it-title a:hover{text-decoration:underline;text-underline-offset:3px}
.it-sum{font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.it-line{font-size:13.5px;color:var(--ink);overflow-wrap:anywhere;white-space:pre-wrap}
.it-line b{font-weight:600;color:var(--muted);margin-right:8px;font-size:12.5px}
.it-line.private{background:var(--panel-2);border:1px dashed var(--line-2);border-radius:7px;padding:5px 9px}
.it-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
.it-meta .row{justify-content:flex-end}
.date{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.shared{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.shared::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--s-done)}
@media (max-width:640px){
  .item{grid-template-columns:minmax(0,1fr);gap:6px;padding:14px 16px}
  .it-meta{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:8px}
  .it-meta .row{justify-content:flex-start}
}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1;padding:5px 9px 5px 8px;border-radius:999px;white-space:nowrap;background:var(--s-hold-bg);color:var(--s-hold)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-doing{background:var(--s-doing-bg);color:var(--s-doing)}
.s-review{background:var(--s-review-bg);color:var(--s-review)}
.s-wait{background:var(--s-wait-bg);color:var(--s-wait)}
.s-done{background:var(--s-done-bg);color:var(--s-done)}
.s-hold{background:var(--s-hold-bg);color:var(--s-hold)}
.s-ref{background:var(--s-ref-bg);color:var(--s-ref)}
.chip.s-doing,.chip.s-review,.chip.s-wait,.chip.s-done,.chip.s-hold,.chip.s-ref{background:var(--panel);border-color:var(--line-2)}
.chip.s-doing .dot{color:var(--s-doing)}.chip.s-review .dot{color:var(--s-review)}.chip.s-wait .dot{color:var(--s-wait)}
.chip.s-done .dot{color:var(--s-done)}.chip.s-hold .dot{color:var(--s-hold)}.chip.s-ref .dot{color:var(--s-ref)}
.chip[aria-pressed="true"] .dot{color:var(--bg)}
.open{font-size:13px;font-weight:500;text-decoration:none;color:var(--accent);white-space:nowrap}
.open:hover{text-decoration:underline;text-underline-offset:3px}
.empty{padding:20px 22px;color:var(--muted);font-size:14px}
.empty-all{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px;background:var(--panel)}

/* forms in place */
.editing{background:var(--panel-2)}
.form{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.form-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:4px}
.g-form{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:16px 18px 16px 20px;border-bottom:1px solid var(--line);background:var(--panel-2);border-radius:11px 11px 0 0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative}
.sw input{position:absolute;opacity:0;inset:0;cursor:pointer}
.sw span{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px 5px 6px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel)}
.sw span::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--c)}
.sw input:checked + span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}

/* accounts */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:20px}
.panel .desc{font-size:14px;color:var(--ink-2);max-width:72ch;text-wrap:pretty}
.accts{display:flex;flex-direction:column}
.acct{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:8px 16px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.acct:first-child{border-top:0;padding-top:4px}
.acct-id b{font-family:var(--f-mono);font-weight:500;font-size:14px;overflow-wrap:anywhere}
.acct-id span{display:block;font-size:13px;color:var(--muted)}
.acct-groups{display:flex;flex-wrap:wrap;gap:5px}
.gchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-2)}
.gchip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.acct-pw{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.acct-pw code{font-family:var(--f-mono);font-size:13px;background:var(--panel-2);padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
.acct-act{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acct.editing .form{grid-column:1/-1}
@media (max-width:760px){.acct{grid-template-columns:minmax(0,1fr)}.acct-act{grid-column:1}}
.acct.editing{padding:16px;border-radius:10px;border:1px solid var(--line);margin-block:6px}
.groupchecks{display:flex;flex-wrap:wrap;gap:8px 16px}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14.5px;color:var(--ink)}
.steps li::marker{font-family:var(--f-mono);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);overflow-wrap:anywhere}

/* save bar & toast */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line-2);box-shadow:0 -6px 20px -14px rgba(0,0,0,.35)}
.savebar .in{max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.savebar .msg{font-size:14px;font-weight:500}
.savebar .msg .mono{color:var(--muted);font-weight:400;margin-left:6px}
.savebar .err{min-height:0;flex-basis:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.foot{margin-top:26px;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.ix,.tab{transition:border-color .15s,background-color .15s,color .15s}}

/* ---- 독립 사이트 추가분: 원본 파일, 보기 화면, 사이트 연결 ---- */
.files{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.files li{min-width:0;max-width:100%}
.file{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-height:34px;padding:5px 10px 5px 6px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);color:var(--ink);font-size:13.5px;cursor:pointer;text-align:left;line-height:1.3}
.file:hover{border-color:var(--accent)}
.ft{flex:0 0 auto;font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;line-height:1.4;padding:1px 6px;border-radius:5px;background:var(--s-hold-bg);color:var(--s-hold)}
.ft-pdf{background:var(--danger-bg);color:var(--danger)}
.ft-html{background:var(--s-doing-bg);color:var(--s-doing)}
.ft-image{background:var(--s-done-bg);color:var(--s-done)}
.fn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.fs{flex:0 0 auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.fs .new{color:var(--s-review);font-family:var(--f-body);font-weight:600}
.fld-lab{display:block}
.ffiles{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ffiles li{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13.5px;min-width:0;font-weight:400;color:var(--ink)}
.ffiles .fn{flex:1}
.ff-empty{font-size:13.5px;margin:6px 0 8px;font-weight:400}

html.v-open,html.v-open body{overflow:hidden}
.viewer{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--bg)}
.v-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line-2)}
.v-name{min-width:0;flex:1 1 200px;display:flex;flex-direction:column;line-height:1.35}
.v-name b{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-name span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-acts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.v-body{flex:1;min-height:0;position:relative;background:var(--panel-2)}
.v-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.v-img{position:absolute;inset:0;overflow:auto;display:flex;padding:16px}
.v-img img{margin:auto;max-width:100%;height:auto}
.v-msg{max-width:460px;margin:0 auto;padding:14vh 20px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--ink-2);font-size:15px;text-wrap:pretty}
.v-msg .row{justify-content:center}

.notes{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:var(--ink-2);max-width:72ch}
.conn{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.conn .ok{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--s-done)}
.conn .ok::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.conn .bad{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--danger)}
.siteurl code{font-size:clamp(14px,3.6vw,17px);letter-spacing:0}
.savebar .row{gap:8px}
.gate-copy ol{margin:4px 0 0;padding-left:20px;color:var(--ink-2);font-size:14.5px;display:grid;gap:5px;max-width:38em}
.gate-copy ol li::marker{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.card .progress{font-size:13px;color:var(--muted);min-height:1.3em}

/* ---------- GitHub ---------- */
async function gh(cfg, path, o) {
  o = o || {};

  var headers = { 'Accept': o.accept || 'application/vnd.github+json', 'Authorization': 'Bearer ' + cfg.token };

  } catch (e) { throw { code: 'network' }; }
  if (!r.ok) {
    var msg = '';
    try { msg = (await r.json()).message || ''; } catch (e) { /* 없음 */ }
    throw { code: 'gh', status: r.status, message: msg };
  }
  if (o.raw === 'text') return r.text();
  if (o.raw === 'bytes') return new Uint8Array(await r.arrayBuffer());

}

  } catch (e) {

}
async function ghCommit(cfg, o) {
  var br = branchOf(cfg);

  var head = ref.object.sha;

  var tree = await gh(cfg, '/git/trees/' + commit.tree.sha + '?recursive=1');
  var paths = {};
  (tree.tree || []).forEach(function (e) { if (e.type === 'blob') paths[e.path] = true; });
  if (paths['vault.json'] && o.expectRev) {
    var cur = await gh(cfg, '/contents/vault.json?ref=' + head, { accept: GH_RAW, raw: 'text' });
    var curRev = null;
    try { curRev = JSON.parse(cur).rev || null; } catch (e) { curRev = null; }
    if (curRev !== o.expectRev) throw { code: 'conflict' };
  }

    var up = o.uploads[i];
    if (o.onProgress) o.onProgress('원본 파일 올리는 중 ' + (i + 1) + '/' + o.uploads.length);
    var b = await gh(cfg, '/git/blobs', { method: 'POST', body: { content: b64e(up.bytes), encoding: 'base64' } });
    entries.push({ path: up.path, mode: '100644', type: 'blob', sha: b.sha });
  }
  if (o.onProgress) o.onProgress('저장하는 중');
  var vb = await gh(cfg, '/git/blobs', { method: 'POST', body: { content: b64e(te.encode(o.vaultText)), encoding: 'base64' } });
  entries.push({ path: 'vault.json', mode: '100644', type: 'blob', sha: vb.sha });
  Object.keys(paths).forEach(function (p) {
    var m = /^files\/([A-Za-z0-9]+)\.bin$/.exec(p);

}
async function save(onProgress) {

var lastKey = null;
function view() {
  switch (S.screen) {
    case 'notready': return notReadyView();
    case 'first': return firstView();

    case 'reset': return resetView();

  }
}
function render(opts) {
  var app = byId('app');
  var key = formKey();
  var keep = {};
  if (opts && opts.keep && key === lastKey) {
    Array.prototype.forEach.call(app.querySelectorAll('input[id],textarea[id],select[id]'), function (el) {
      if (el.type === 'file') return;
      if (el.type === 'radio' || el.type === 'checkbox') keep[el.id] = { c: el.checked };
      else keep[el.id] = { v: el.value };
    });
  }
  var act = document.activeElement;
  var focusId = act && app.contains(act) ? act.id : '';
  var selS = null, selE = null;
  try { if (focusId) { selS = act.selectionStart; selE = act.selectionEnd; } } catch (e) { /* 없음 */ }
  var sy = window.scrollY;
  app.innerHTML = view();
  Object.keys(keep).forEach(function (id) {
    var el = byId(id);
    if (!el) return;
    if ('c' in keep[id]) el.checked = keep[id].c; else el.value = keep[id].v;
  });
  if (focusId) {
    var el = byId(focusId);
    if (el && !el.disabled) {
      try { el.focus({ preventScroll: true }); } catch (e) { /* 없음 */ }
      try { if (selS != null) el.setSelectionRange(selS, selE); } catch (e) { /* 없음 */ }
    }
  }
  window.scrollTo(0, sy);
  lastKey = key;
  if (S.screen === 'code') { var go = byId('rc-go'), ok = byId('rc-ok'); if (go && ok) go.disabled = !ok.checked || S.ui.busy; }
  renderSaveBar();
}

    case 'view-file': openViewer(d.id, d.fid, b); break;
    case 'v-close': closeViewer(); break;
    case 'v-tab': viewerNewTab(); break;
    case 'v-dl': viewerDownload(); break;
    case 'add-group': closeEditors(); S.ui.newGroup = true; render(); focusEl('gf-name'); break;
    case 'edit-group': closeEditors(); S.ui.editGroup = d.g; render(); focusEl('gf-name'); break;
    case 'move-group': {
      var g = findGroup(d.g); if (!g) break;
      var i = S.groups.indexOf(g), j = i + Number(d.d);
      if (j < 0 || j >= S.groups.length) break;
      S.groups.splice(i, 1); S.groups.splice(j, 0, g);
      dirty(); render({ keep: true });
      break;
    }
    case 'add-item': closeEditors(); S.ui.addTo = d.g; S.ui.formFiles = []; render(); focusEl('f-title'); break;
    case 'edit-item': {
      var fi = findItem(d.id); if (!fi) break;
      closeEditors(); S.ui.edit = d.id; S.ui.formFiles = (fi.it.files || []).map(function (x) { return Object.assign({}, x); });
      render(); focusEl('f-title'); break;
    }
    case 'ff-add': { var inp = byId('f-files'); if (inp) inp.click(); break; }
    case 'ff-remove': {
      var ff = S.ui.formFiles || [];
      var gone = ff.filter(function (x) { return x.fid === d.fid; });
      S.ui.formFiles = ff.filter(function (x) { return x.fid !== d.fid; });
      discardList(gone);
      render({ keep: true });
      break;
    }
    case 'cancel-edit': closeEditors(); render(); break;
    case 'ask-del': S.ui.confirmDel = d.key; render({ keep: true }); break;
    case 'cancel-del': S.ui.confirmDel = null; render({ keep: true }); break;
    case 'do-del': onDelete(d.key); break;
    case 'gen-pw': { var t = byId(d.target); if (t) { t.value = genPassword(); t.focus(); t.select(); } break; }
    case 'show-pw': S.ui.showPw = S.ui.showPw === d.id ? null : d.id; render({ keep: true }); break;
    case 'copy-invite': {
      var gu = S.admin.guests.filter(function (x) { return x.id === d.id; })[0];
      if (gu) copyText(HUB_NAME + '\n주소: ' + siteUrl() + '\n아이디: ' + gu.id + '\n비밀번호: ' + gu.pw);
      break;
    }
    case 'edit-acct': closeEditors(); S.ui.acctEdit = d.id; render(); focusEl('e-label'); break;
    case 'owner-form': closeEditors(); S.ui.ownerForm = true; render(); focusEl(S.kek ? 'o-cur' : 'o-id'); break;
    case 'gh-form': closeEditors(); S.ui.ghForm = true; render(); focusEl('gh-token'); break;
    case 'regen-code': onRegenCode(); break;
    case 'save': onSave(); break;
    case 'revert': closeViewer(); restoreSnapshot(); render(); toast('저장하지 않은 변경을 되돌렸어요'); break;
    case 'logout':
      if (S.dirty && !S.ui.confirmLogout) { S.ui.confirmLogout = true; render({ keep: true }); toast('저장하지 않은 변경이 있어요.'); break; }
      logout();
      break;
    case 'cancel-logout': S.ui.confirmLogout = false; render({ keep: true }); break;
  }
});

/* ---------- 시작 ---------- */
async function loadVault() {
  var r;
  try { r = await fetch('vault.json?t=' + Date.now(), { cache: 'no-store' }); } catch (e) { return { err: 'net' }; }
  if (r.status === 404) return { err: 'missing' };
  if (!r.ok) return { err: 'net' };
  var v;
  try { v = await r.json(); } catch (e) { return { err: 'bad' }; }
  if (!validVault(v)) return { err: 'bad' };
  return { vault: v };
}
async function fetchFreshVault(m) {
  try {
    var r = await fetch(GH_API + '/repos/' + encodeURIComponent(m.owner) + '/' + encodeURIComponent(m.repo) + '/contents/vault.json?ref=' + encodeURIComponent(m.branch || 'main'),
      { cache: 'no-store', headers: { 'Accept': GH_RAW } });
    if (!r.ok) return null;
    var v = JSON.parse(await r.text());
    return validVault(v) ? v : null;
  } catch (e) { return null; }
}
async function boot() {
  var slots = document.createElement('div');
  slots.innerHTML = '<div id="hub-savebar"></div><div id="hub-toast" aria-live="polite"></div><div id="hub-viewer"></div>';
  while (slots.firstChild) document.body.appendChild(slots.firstChild);
  if (!window.crypto || !crypto.subtle) { S.ui.loadErr = 'crypto'; S.screen = 'notready'; render(); return; }
  S.screen = 'loading'; render();
  var res = await loadVault();
  if (res.err) { S.ui.loadErr = res.err; S.screen = 'notready'; render(); return; }
  vault = res.vault;
  var m = recentSave();
  if (m && vault.rev !== m.rev) {
    var fresh = await fetchFreshVault(m);
    if (fresh) vault = fresh; else S.staleHint = true;
  }
  if (!Object.keys(vault.accounts).length) { S.screen = 'first'; render(); return; }
  if (unstash() && await tryRestore()) {
    S.screen = 'hub'; render();
    afterEnter();
    return;
  }
  S.screen = 'login'; render();
}
boot();
})();
